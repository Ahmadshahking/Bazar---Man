<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Login -Bazar man</title>
    <Style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </Style>
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-sm border rounded rounded-3" style="width:450px;">
            
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="text-primary">
                       
                        <span class="bi bi-check-circle-fill fs-3"></span>
                         <span class="fs-2 fw-bold ms-2">Bazar Man</span>
                    </div>
                </div>
                <h3>Welcome to your Bazar Man Acconut</h3>
                <p class="text-muted mb-0">
                    Login to your Bazar Man account
                </p>
                <div class="pb-3 pt-3">
                    <label for="email" class="form-label fw-semibold">Email</label>
                    <div>
                        <input type="email" class="form-control" placeholder="Enter Your Email" id="password">
                    </div>
                </div>
                <div class="pb-3 pt-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div>
                        <input type="password" class="form-control" placeholder="Your password" id="password">
                    </div>
                </div>
                <div class="pb-2 pt-1 ">
                  
                    <div >
                        <input type="checkbox" class="form-check-input"> <label for="remember" class="form-check-label" >Remember me</label>
                         <a href="#" class="text-decoration-none float-end " >Forgot yout Password ?</a>
                    </div>
                </div>
                
               <div class="text-center pt-3 ">
                 <button class="btn btn-primary  w-75">Log in</button>
               </div>
                <p class="pt-4">Don't have an account ?  <a href="#" class="text-decoration-none"> Register</a> </p>
            </div>
        </div>
    </div>

</body>

</html>
